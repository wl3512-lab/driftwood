<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Build a garden with AI animal helpers, and notice when their advice starts to drift." />
    <meta name="theme-color" content="#030504" />
    <title>Driftwood</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/mood-garden-favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon-180.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Driftwood">
    <meta property="og:description" content="Build a garden with AI animal helpers, and notice when their advice starts to drift.">
    <meta property="og:image" content="icons/og-cover.png">
    <!-- The game lives in v2/. This page only forwards there. -->
    <meta http-equiv="refresh" content="0; url=./v2/">
    <script>
      // No offline worker on a local dev server: it would keep serving old files.
      var dev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        if (dev) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
        else navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () {});
      }
      location.replace("./v2/" + location.search + location.hash);
    </script>
    <style>body{background:#fdf6e3;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}</style>
  </head>
  <body>
    <p><a href="./v2/">Play Driftwood</a></p>
  </body>
</html>
